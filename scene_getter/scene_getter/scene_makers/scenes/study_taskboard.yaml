# User-study taskboard block. Names follow robothon_scene_maker.py's board
# features (peg_hole, probe_hole, door, cable_holder) plus the two movable
# items the participant commands. Positions are the mocked-scene stand-in for
# that node's static transforms; re-measure them if the board moves.
peg1:
  position: [0.5, 0.06, 0.04]
  params: peg1 is a black plastic peg.
peghole1:
  position: [0.52, 0.1, 0.04]
  params: peghole1 is a round hole on the board. You can put a peg into peghole1.
probe1:
  position: [0.5, -0.06, 0.04]
  params: probe1 is a red probe with a thin metal tip.
probehole1:
  position: [0.46, -0.1, 0.04]
  params: probehole1 is a terminal block on the board. You can put a probe into probehole1.
door1:
  position: [0.515, -0.045, 0.04]
  params: door1 is a blue hinged door on the board.
cableholder1:
  position: [0.585, 0.0, 0.04]
  params: cableholder1 is a clip on the board that holds a cable.
